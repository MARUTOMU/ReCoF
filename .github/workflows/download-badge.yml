# Counts the downloads of the game zips of every release (ReCoF-v<version>.zip, installed by hand, and
# recof-<version>.zip, installed by the ReCoF Launcher) and writes the total to downloads.json on the badges
# branch, which the README's download badge reads through shields.io. The manifest and its signature are left
# out: the launcher fetches them on every update check, so they say nothing about how many people play.

name: Download badge

on:
  schedule:
    - cron: "17 */3 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-badge
  cancel-in-progress: true

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Count the zip downloads and publish them for the badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].assets[] | select(.name | test("^(recof|ReCoF)-.*\\.zip$")) | .download_count' \
            | awk '{ s += $1 } END { print s + 0 }')
          echo "zip downloads: ${total}"
          mkdir out
          cd out
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"blue"}\n' "${total}" > downloads.json
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.json
          git commit -q -m "downloads: ${total}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
